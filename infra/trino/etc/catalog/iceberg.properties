# Trino <-> Iceberg wiring.
#
# The warehouse lives on the local filesystem of the `iceberg_warehouse` volume,
# mounted at /warehouse in this container and in every other container that
# touches Iceberg. HadoopCatalog stores the catalog metadata (table pointers,
# snapshots, schemas) inside that same directory, so no separate catalog service
# is required. See docs/decisions/ADR-009-iceberg-catalog.md.
connector.name=iceberg

iceberg.catalog.type=hadoop
iceberg.catalog-name=pcl
iceberg.hadoop-catalog.warehouse=file:///warehouse

# Table format defaults for anything created through Trino. The Beam pipeline
# creates its own tables and declares the same format explicitly. Note that
# format_version=2 is NOT set here: in a Trino .properties file, map-typed
# options need the dotted `key=value` form, and the bootstrap DDL already sets
# `format_version = 2` explicitly in its WITH clause.
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD

# Snowflake is used as a canonical identifier for table names in the engine.
iceberg.register-table-procedure.enabled=true
iceberg.materialized-view-enabled=false