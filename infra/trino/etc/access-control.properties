# Trino is a read-only SQL endpoint. The rules file grants SELECT on the
# lakehouse catalogs and nothing else: no client can create, write, or own a
# table, schema, or view, so the engine cannot become a second writer.
access-control.name=file
security.config-file=/etc/trino/access-control-rules.json
# Reload the rules without a coordinator restart when the mounted file changes.
security.refresh-period=1s
