# Trino is the serving engine: data tables are read-only, and only the
# dedicated `pcl-provisioner` identity may define the serving view. The rules
# file grants SELECT on the lakehouse catalogs and OWNERSHIP of exactly
# `serving.orders_current` to that identity, so a normal query cannot write.
access-control.name=file
security.config-file=/etc/trino/access-control-rules.json
# Reload the rules without a coordinator restart when the mounted file changes.
security.refresh-period=1s
