# Postgres-backed run and event history.
storage:
  postgres:
    postgres_db:
      username:
        env: PCL_POSTGRES_USER
      password:
        env: PCL_POSTGRES_PASSWORD
      hostname: postgres
      port: 5432
      db_name: dagster

telemetry:
  enabled: false

# One run at a time: overlapping projections would conflict on Iceberg files.
run_coordinator:
  module: dagster._core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1
