# ---------------------------------------------------------------------------
# Portable CDC Lakehouse — local lakehouse stack.
#
# Design notes
#   * Every image uses a pinned tag for reproducible local runs.
#   * Networking is deliberately conservative. Kafka advertises only its
#     in-network address (`kafka:9092`) and is NOT published to the host, so
#     there is a single unambiguous address for clients. The Beam application
#     joins this network and therefore uses the same value; publishing the port
#     would force an advertised-listener split between host and container
#     clients, which is a classic source of silent misconfiguration.
#   * MinIO provides S3-compatible object storage for the Iceberg warehouse.
#     Beam, Spark and Trino use the same endpoint, bucket and credentials.
#   * Postgres runs with logical WAL decoding enabled for Debezium.
#
# Usage is always through Rake (`rake infra:up`), never by calling
# `podman compose` by hand, so that readiness is awaited and errors are clear.
# ---------------------------------------------------------------------------

services:

  postgres:
    image: docker.io/library/postgres:17.2-bookworm
    container_name: pcl-postgres
    # Debezium reads PostgreSQL changes from the logical WAL.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_DB: ${PCL_POSTGRES_DB}
      POSTGRES_USER: ${PCL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PCL_POSTGRES_PASSWORD}
      # Deterministic collation so fixture ordering does not depend on the host.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Source schema is applied once, on first initialisation of an empty volume.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PCL_POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PCL_POSTGRES_USER} -d ${PCL_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  kafka:
    image: docker.io/apache/kafka:3.9.1
    container_name: pcl-kafka
    # Single-node KRaft: this node is both broker and controller. Sufficient for
    # a POC and avoids ZooKeeper entirely.
    environment:
      CLUSTER_ID: ${PCL_KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single node, so every replication factor collapses to 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # Uses the image's own tooling: no shell interpolation tricks needed.
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  minio:
    image: localhost/pcl-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./infra/minio
      dockerfile: Containerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
        GO_BUILDER_IMAGE: docker.io/library/golang:1.24.8-bookworm
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${PCL_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${PCL_MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${PCL_MINIO_API_PORT}:9000"
      - "127.0.0.1:${PCL_MINIO_CONSOLE_PORT}:9001"

  # One-shot metastore bootstrap. Since Polaris 1.8.0 the server no longer
  # creates its own tables, so the admin tool must run `bootstrap` first. It is
  # idempotent: an already-bootstrapped realm is reported and skipped, which
  # keeps `rake infra:up` re-runnable.
  polaris-bootstrap:
    image: docker.io/apache/polaris-admin-tool:${PCL_POLARIS_VERSION}
    container_name: pcl-polaris-bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: ${PCL_POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${PCL_POSTGRES_PASSWORD}
      QUARKUS_OTEL_SDK_DISABLED: "true"
    command:
      - bootstrap
      - -r
      - POLARIS
      - -c
      - POLARIS,${PCL_POLARIS_CLIENT_ID},${PCL_POLARIS_CLIENT_SECRET}
    restart: "no"

  # Apache Polaris is the Iceberg REST catalog. Its metastore is the same
  # PostgreSQL instance (database `polaris`, schema `polaris_schema`), so the
  # catalog survives container restarts without SQLite or a local file.
  # `stsUnavailable=true` on the catalog disables credential vending: MinIO does
  # not implement STS, and Beam/Trino already hold their own S3 credentials.
  polaris:
    image: docker.io/apache/polaris:${PCL_POLARIS_VERSION}
    container_name: pcl-polaris
    depends_on:
      postgres:
        condition: service_healthy
      polaris-bootstrap:
        condition: service_completed_successfully
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: "5"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: "100"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: "5000"
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: ${PCL_POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${PCL_POSTGRES_PASSWORD}
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      QUARKUS_OTEL_SDK_DISABLED: "true"
      # Only S3 is allowed. `ALLOW_INSECURE_STORAGE_TYPES` is deliberately NOT
      # set: it exists for FILE storage, and Polaris treats it as a severe
      # readiness issue. MinIO needs no STS, which `stsUnavailable` covers.
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": '["S3"]'
      # Polaris needs these to reach MinIO when it inspects or creates metadata.
      AWS_ACCESS_KEY_ID: ${PCL_MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${PCL_MINIO_ROOT_PASSWORD}
      AWS_REGION: ${PCL_MINIO_REGION}
    ports:
      - "127.0.0.1:${PCL_ICEBERG_CATALOG_PORT}:8181"
      - "127.0.0.1:${PCL_POLARIS_HEALTH_PORT:-8182}:8182"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  # One-shot catalog bootstrap. Idempotent: it checks for the catalog first and
  # only creates it when missing, so `rake infra:up` can be re-run safely.
  polaris-setup:
    image: docker.io/alpine/curl:8.22.0
    container_name: pcl-polaris-setup
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      PCL_POLARIS_CLIENT_ID: ${PCL_POLARIS_CLIENT_ID}
      PCL_POLARIS_CLIENT_SECRET: ${PCL_POLARIS_CLIENT_SECRET}
      PCL_ICEBERG_BUCKET: ${PCL_ICEBERG_BUCKET}
      PCL_MINIO_REGION: ${PCL_MINIO_REGION}
    volumes:
      - ./infra/polaris:/polaris:ro
    entrypoint: ["/bin/sh", "/polaris/create-catalog.sh"]
    restart: "no"

  connect:
    image: quay.io/debezium/connect:3.2.4.Final
    container_name: pcl-connect
    depends_on:
      - postgres
      - kafka
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: pcl-connect-cluster
      CONFIG_STORAGE_TOPIC: pcl_connect_configs
      OFFSET_STORAGE_TOPIC: pcl_connect_offsets
      STATUS_STORAGE_TOPIC: pcl_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      # Debezium reads logical decoding from Postgres as this user.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    ports:
      - "127.0.0.1:${PCL_CONNECT_PORT}:8083"

  trino:
    image: docker.io/trinodb/trino:476
    container_name: pcl-trino
    depends_on:
      # Trino loads the Iceberg catalog at startup; the `pcl` catalog must exist
      # in Polaris by then, otherwise the connector fails and stays broken.
      polaris-setup:
        condition: service_completed_successfully
    volumes:
      # Generated from the local .env; contains credentials and is gitignored.
      - ./.local/trino/catalog:/etc/trino/catalog:ro
      # Trino is the serving layer only. The file-based access control grants
      # SELECT on the lakehouse catalogs to every client and OWNERSHIP of the
      # serving view to `pcl-provisioner` alone, so data writes are rejected by
      # the engine and only the view definition can be managed from Trino.
      - ./infra/trino/etc/access-control.properties:/etc/trino/access-control.properties:ro
      - ./infra/trino/etc/access-control-rules.json:/etc/trino/access-control-rules.json:ro
      - trino_data:/var/lib/trino/data
    ports:
      - "127.0.0.1:${PCL_TRINO_PORT}:8080"
    healthcheck:
      # Trino takes longer to initialise its Iceberg connector on this small
      # single-node POC than the upstream image's 10 second startup window.
      test: ["CMD-SHELL", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s

  # --- Dagster (scheduled orchestration) ------------------------------------
  #
  # The webserver only serves the UI and loads the code location, so it needs no
  # engine access and lives here like any other service. The daemon executes runs
  # and starts Spark/Beam as sibling containers, so it needs the Podman socket;
  # `rake dagster:up` starts it with the engine client directly, because
  # podman-compose rewrites absolute bind sources on Windows and turns the socket
  # into an empty directory. Bind mounts inside the containers it starts are
  # resolved by the host engine, so PCL_HOST_WORKSPACE holds the host repository
  # path.
  dagster-webserver:
    image: localhost/pcl-dagster:${PCL_DAGSTER_VERSION:-1.13.27}
    build:
      context: ./infra/dagster
    container_name: pcl-dagster-webserver
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DAGSTER_HOME: /opt/dagster/home
    command:
      - dagster-webserver
      - -h
      - 0.0.0.0
      - -p
      - "3000"
      - -w
      - /opt/dagster/app/workspace.yaml
    volumes:
      - ./infra/dagster/dagster.yaml:/opt/dagster/home/dagster.yaml:ro
      - dagster_home:/opt/dagster/home/storage
    ports:
      - "127.0.0.1:${PCL_DAGSTER_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://localhost:3000/server_info")
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Apache Spark is the batch transformation layer: it owns the Iceberg DDL, the
  # incremental MERGE into silver, and the replay rebuild. Trino never writes.
  #
  # This is a one-shot CLI image, not a long-running service: Rake starts
  # `spark-sql`, runs a script against Polaris and exits. The `tools` profile
  # keeps it out of `rake infra:up`; the service exists so the image is built
  # from Compose with the same pinned versions as the rest of the stack.
  spark:
    image: localhost/pcl-spark:${PCL_SPARK_VERSION:-3.5.9}-iceberg-${PCL_SPARK_ICEBERG_VERSION:-1.11.0}
    build:
      context: ./infra/spark
      args:
        SPARK_VERSION: ${PCL_SPARK_VERSION:-3.5.9}
        ICEBERG_VERSION: ${PCL_SPARK_ICEBERG_VERSION:-1.11.0}
    volumes:
      - ./sql:/opt/pcl/sql:ro
      - ./.local/spark:/opt/pcl/conf:ro
    working_dir: /tmp
    restart: "no"
    profiles: ["tools"]

  flink-jobmanager:
    image: docker.io/library/flink:2.2.1-java21
    container_name: pcl-flink-jobmanager
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        rest.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
        parallelism.default: 1
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.backend.type: rocksdb
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
        classloader.parent-first-patterns.default: "java.";"org.apache.flink.";"com.esotericsoftware.kryo";"org.apache.hadoop.";"javax.annotation.";"org.xml";"javax.xml";"org.apache.xerces";"org.w3c";"org.rocksdb.";"org.slf4j";"org.apache.log4j";"org.apache.logging";"org.apache.commons.logging";"ch.qos.logback"
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    ports:
      - "127.0.0.1:${PCL_FLINK_WEB_PORT:-8081}:8081"
    profiles: ["flink"]

  # --- Lambda speed layer -----------------------------------------------------
  #
  # The speed job is deliberately not part of the Dagster graph: it runs
  # continuously on Flink, with its own consumer group and checkpointed Kafka
  # offsets, and appends to `speed.order_cdc_events`. It never writes canonical
  # `raw`; Spark owns that boundary. Restarting it replays from the last
  # checkpoint/committed offset, and the serving view absorbs duplicates.
  pipeline-speed:
    image: ${PCL_SBT_IMAGE:-docker.io/sbtscala/scala-sbt:eclipse-temurin-21.0.12_8_1.13.0_2.13.18}
    container_name: pcl-pipeline-speed
    depends_on:
      kafka:
        condition: service_healthy
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    env_file: .env
    environment:
      PCL_RUN_ID: speed
      PCL_PIPELINE_LAYER: speed
      PCL_CONSUMER_GROUP: pcl-speed-${PCL_SOURCE_ID}
      PCL_TARGET_TABLE: speed.order_cdc_events
      PCL_COMMIT_OFFSETS: "true"
      PCL_MAX_RECORDS: "0"
    volumes:
      - pcl-build-target:/workspace/target:ro
    working_dir: /workspace
    entrypoint: ["java", "-jar", "/workspace/target/scala-2.13/pcl-pipeline.jar"]
    command:
      - --runner=org.apache.beam.runners.flink.FlinkRunner
      - --flinkMaster=flink-jobmanager:8081
      - --checkpointingInterval=10000
      - --checkpointingMode=EXACTLY_ONCE
      - --externalizedCheckpointsEnabled=true
      - --retainExternalizedCheckpointsOnCancellation=true
    restart: unless-stopped
    profiles: ["speed"]

  flink-taskmanager:
    image: docker.io/library/flink:2.2.1-java21
    container_name: pcl-flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1280m
        taskmanager.memory.network.min: 128mb
        taskmanager.memory.network.max: 128mb
        taskmanager.memory.network.fraction: 0.2
        taskmanager.memory.managed.fraction: 0.2
        taskmanager.numberOfTaskSlots: 1
        parallelism.default: 1
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.backend.type: rocksdb
        classloader.parent-first-patterns.default: "java.";"org.apache.flink.";"com.esotericsoftware.kryo";"org.apache.hadoop.";"javax.annotation.";"org.xml";"javax.xml";"org.apache.xerces";"org.w3c";"org.rocksdb.";"org.slf4j";"org.apache.log4j";"org.apache.logging";"org.apache.commons.logging";"ch.qos.logback"
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    profiles: ["flink"]

volumes:
  postgres_data:
  kafka_data:
  minio_data:
  trino_data:
  flink_checkpoints:
  dagster_home:
  # Built by `rake assembly`; the speed job mounts the same artifact the batch
  # path runs, so there is one implementation of the Beam graph.
  pcl-build-target:
    external: true
