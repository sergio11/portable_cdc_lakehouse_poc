# Portable CDC lakehouse stack. Usage through Rake (`rake infra:up`).

services:

  postgres:
    image: docker.io/library/postgres:17.2-bookworm
    container_name: pcl-postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_DB: ${PCL_POSTGRES_DB}
      POSTGRES_USER: ${PCL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PCL_POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PCL_POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PCL_POSTGRES_USER} -d ${PCL_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  kafka:
    image: docker.io/apache/kafka:3.9.1
    container_name: pcl-kafka
    environment:
      CLUSTER_ID: ${PCL_KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  minio:
    image: localhost/pcl-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./infra/minio
      dockerfile: Containerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
        GO_BUILDER_IMAGE: docker.io/library/golang:1.24.8-bookworm
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${PCL_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${PCL_MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${PCL_MINIO_API_PORT}:9000"
      - "127.0.0.1:${PCL_MINIO_CONSOLE_PORT}:9001"

  # Polaris 1.8+ requires an explicit metastore bootstrap first.
  polaris-bootstrap:
    image: docker.io/apache/polaris-admin-tool:${PCL_POLARIS_VERSION}
    container_name: pcl-polaris-bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: ${PCL_POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${PCL_POSTGRES_PASSWORD}
      QUARKUS_OTEL_SDK_DISABLED: "true"
    command:
      - bootstrap
      - -r
      - POLARIS
      - -c
      - POLARIS,${PCL_POLARIS_CLIENT_ID},${PCL_POLARIS_CLIENT_SECRET}
    restart: "no"

  # Iceberg REST catalog backed by the same PostgreSQL server.
  # stsUnavailable: MinIO has no STS and clients bring their own S3 credentials.
  polaris:
    image: docker.io/apache/polaris:${PCL_POLARIS_VERSION}
    container_name: pcl-polaris
    depends_on:
      postgres:
        condition: service_healthy
      polaris-bootstrap:
        condition: service_completed_successfully
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: "5"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: "100"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: "5000"
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: ${PCL_POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${PCL_POSTGRES_PASSWORD}
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      QUARKUS_OTEL_SDK_DISABLED: "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": '["S3"]'
      AWS_ACCESS_KEY_ID: ${PCL_MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${PCL_MINIO_ROOT_PASSWORD}
      AWS_REGION: ${PCL_MINIO_REGION}
    ports:
      - "127.0.0.1:${PCL_ICEBERG_CATALOG_PORT}:8181"
      - "127.0.0.1:${PCL_POLARIS_HEALTH_PORT:-8182}:8182"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  # Idempotent catalog bootstrap.
  polaris-setup:
    image: docker.io/alpine/curl:8.22.0
    container_name: pcl-polaris-setup
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      PCL_POLARIS_CLIENT_ID: ${PCL_POLARIS_CLIENT_ID}
      PCL_POLARIS_CLIENT_SECRET: ${PCL_POLARIS_CLIENT_SECRET}
      PCL_ICEBERG_BUCKET: ${PCL_ICEBERG_BUCKET}
      PCL_MINIO_REGION: ${PCL_MINIO_REGION}
    volumes:
      - ./infra/polaris:/polaris:ro
    entrypoint: ["/bin/sh", "/polaris/create-catalog.sh"]
    restart: "no"

  connect:
    image: quay.io/debezium/connect:3.2.4.Final
    container_name: pcl-connect
    depends_on:
      - postgres
      - kafka
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: pcl-connect-cluster
      CONFIG_STORAGE_TOPIC: pcl_connect_configs
      OFFSET_STORAGE_TOPIC: pcl_connect_offsets
      STATUS_STORAGE_TOPIC: pcl_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    ports:
      - "127.0.0.1:${PCL_CONNECT_PORT}:8083"

  trino:
    image: docker.io/trinodb/trino:476
    container_name: pcl-trino
    depends_on:
      polaris-setup:
        condition: service_completed_successfully
    volumes:
      - ./.local/trino/catalog:/etc/trino/catalog:ro
      # Read-only: Spark and Flink own every write.
      - ./infra/trino/etc/access-control.properties:/etc/trino/access-control.properties:ro
      - ./infra/trino/etc/access-control-rules.json:/etc/trino/access-control-rules.json:ro
      - trino_data:/var/lib/trino/data
    ports:
      - "127.0.0.1:${PCL_TRINO_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s

  # Webserver serves the UI; the daemon executes runs and needs the Podman socket.
  dagster-webserver:
    image: localhost/pcl-dagster:${PCL_DAGSTER_VERSION:-1.13.27}
    build:
      context: ./infra/dagster
    container_name: pcl-dagster-webserver
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DAGSTER_HOME: /opt/dagster/home
    command:
      - dagster-webserver
      - -h
      - 0.0.0.0
      - -p
      - "3000"
      - -w
      - /opt/dagster/app/workspace.yaml
    volumes:
      - ./infra/dagster/dagster.yaml:/opt/dagster/home/dagster.yaml:ro
      - dagster_home:/opt/dagster/home/storage
    ports:
      - "127.0.0.1:${PCL_DAGSTER_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://localhost:3000/server_info")
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # One-shot Spark CLI image: Rake runs spark-sql against Polaris and exits.
  spark:
    image: localhost/pcl-spark:${PCL_SPARK_VERSION:-3.5.9}-iceberg-${PCL_SPARK_ICEBERG_VERSION:-1.11.0}
    build:
      context: ./infra/spark
      args:
        SPARK_VERSION: ${PCL_SPARK_VERSION:-3.5.9}
        ICEBERG_VERSION: ${PCL_SPARK_ICEBERG_VERSION:-1.11.0}
    volumes:
      - ./sql:/opt/pcl/sql:ro
      - ./.local/spark:/opt/pcl/conf:ro
    working_dir: /tmp
    restart: "no"
    profiles: ["tools"]

  flink-jobmanager:
    image: localhost/pcl-flink:${PCL_FLINK_VERSION:-2.2.1}-${PCL_FLINK_VARIANT:-java21}-iceberg-${PCL_ICEBERG_FLINK_VERSION:-1.12.0}
    build:
      context: ./infra/flink
      args:
        FLINK_VERSION: ${PCL_FLINK_VERSION:-2.2.1}
        FLINK_VARIANT: ${PCL_FLINK_VARIANT:-java21}
        ICEBERG_VERSION: ${PCL_ICEBERG_FLINK_VERSION:-1.12.0}
    container_name: pcl-flink-jobmanager
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        rest.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
        parallelism.default: 1
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.backend.type: rocksdb
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
        classloader.parent-first-patterns.default: "java.";"org.apache.flink.";"com.esotericsoftware.kryo";"org.apache.hadoop.";"javax.annotation.";"org.xml";"javax.xml";"org.apache.xerces";"org.w3c";"org.rocksdb.";"org.slf4j";"org.apache.log4j";"org.apache.logging";"org.apache.commons.logging";"ch.qos.logback"
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    ports:
      - "127.0.0.1:${PCL_FLINK_WEB_PORT:-8081}:8081"
    profiles: ["flink"]

  # Speed layer: outside the Dagster graph. Beam appends to the raw log.
  pipeline-speed:
    image: ${PCL_SBT_IMAGE:-docker.io/sbtscala/scala-sbt:eclipse-temurin-21.0.12_8_1.13.0_2.13.18}
    container_name: pcl-pipeline-speed
    depends_on:
      kafka:
        condition: service_healthy
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    env_file: .env
    environment:
      PCL_RUN_ID: speed
      PCL_PIPELINE_LAYER: speed
      PCL_CONSUMER_GROUP: pcl-speed-${PCL_SOURCE_ID}
      PCL_TARGET_TABLE: raw.order_cdc_events
      PCL_COMMIT_OFFSETS: "true"
      PCL_MAX_RECORDS: "0"
    volumes:
      - pcl-build-target:/workspace/target:ro
    working_dir: /workspace
    entrypoint: ["java", "-jar", "/workspace/target/scala-2.13/pcl-pipeline.jar"]
    command:
      - --runner=org.apache.beam.runners.flink.FlinkRunner
      - --flinkMaster=flink-jobmanager:8081
      - --checkpointingInterval=10000
      - --checkpointingMode=EXACTLY_ONCE
      - --externalizedCheckpointsEnabled=true
      - --retainExternalizedCheckpointsOnCancellation=true
    restart: unless-stopped
    profiles: ["speed"]

  # Flink SQL upsert writer; submits detached and exits.
  pipeline-serving:
    image: localhost/pcl-flink:${PCL_FLINK_VERSION:-2.2.1}-${PCL_FLINK_VARIANT:-java21}-iceberg-${PCL_ICEBERG_FLINK_VERSION:-1.12.0}
    container_name: pcl-pipeline-serving
    depends_on:
      polaris-setup:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    volumes:
      - ./.local/flink:/opt/pcl/sql:ro
    entrypoint: ["/opt/flink/bin/sql-client.sh"]
    command:
      - embedded
      - -D
      - execution.target=remote
      - -D
      - rest.address=flink-jobmanager
      - -D
      - rest.port=8081
      - -D
      - execution.attached=false
      - -f
      - /opt/pcl/sql/serving.sql
    restart: "no"
    profiles: ["speed"]

  flink-taskmanager:
    image: localhost/pcl-flink:${PCL_FLINK_VERSION:-2.2.1}-${PCL_FLINK_VARIANT:-java21}-iceberg-${PCL_ICEBERG_FLINK_VERSION:-1.12.0}
    container_name: pcl-flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 2048m
        taskmanager.memory.network.min: 128mb
        taskmanager.memory.network.max: 256mb
        taskmanager.memory.network.fraction: 0.2
        taskmanager.memory.managed.fraction: 0.2
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.backend.type: rocksdb
        classloader.parent-first-patterns.default: "java.";"org.apache.flink.";"com.esotericsoftware.kryo";"org.apache.hadoop.";"javax.annotation.";"org.xml";"javax.xml";"org.apache.xerces";"org.w3c";"org.rocksdb.";"org.slf4j";"org.apache.log4j";"org.apache.logging";"org.apache.commons.logging";"ch.qos.logback"
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    profiles: ["flink"]

volumes:
  postgres_data:
  kafka_data:
  minio_data:
  trino_data:
  flink_checkpoints:
  dagster_home:
  pcl-build-target:
    external: true
